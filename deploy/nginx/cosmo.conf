# Nginx in front of the Next.js app (docker compose service `app`).
#
# Domain: replace cosmo.example.org everywhere, then reload:
#   docker compose -f docker-compose.prod.yml exec nginx nginx -t
#   docker compose -f docker-compose.prod.yml exec nginx nginx -s reload

# ── Rate limits (protect the public write endpoints) ────────────────────────
limit_req_zone $binary_remote_addr zone=inquiry:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=40r/s;

# Required by proxy_params.inc for websocket-style upgrades.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream cosmo_app {
    server app:3000;
    keepalive 32;
}

# ── HTTP: ACME challenge + redirect ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name cosmo.example.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ───────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cosmo.example.org;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Uploads are capped at 5 MB in the app; leave a little headroom.
    client_max_body_size 8m;
    client_body_timeout 30s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/rss+xml application/atom+xml image/svg+xml application/xml;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # ── Public write endpoints: tight limits ────────────────────────────────
    location = /api/inquiry {
        limit_req zone=inquiry burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://cosmo_app;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    location = /api/auth/login {
        limit_req zone=login burst=6 nodelay;
        limit_req_status 429;
        proxy_pass http://cosmo_app;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # ── Immutable build assets ──────────────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://cosmo_app;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Uploaded media (disk driver) ────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://cosmo_app;
        include /etc/nginx/conf.d/proxy_params.inc;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ── Everything else ─────────────────────────────────────────────────────
    location / {
        limit_req zone=general burst=80 nodelay;
        proxy_pass http://cosmo_app;
        include /etc/nginx/conf.d/proxy_params.inc;
    }

    # Optional: restrict the admin panel to the school network / VPN.
    # location /admin {
    #     allow 203.0.113.0/24;
    #     deny all;
    #     proxy_pass http://cosmo_app;
    #     include /etc/nginx/conf.d/proxy_params.inc;
    # }
}
