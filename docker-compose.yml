services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 10

  wordpress:
    image: wordpress:6.7-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_data:/var/www/html

  # Phase 1: PostgreSQL becomes the CMS master (Next.js reads/writes via Drizzle).
  # Host port 5434 — 5432/5433 are taken on this machine.
  pg:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: cosmo
      POSTGRES_USER: cosmo
      POSTGRES_PASSWORD: cosmo
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmo -d cosmo"]
      timeout: 5s
      retries: 10

volumes:
  db_data:
  wp_data:
  pg_data:
